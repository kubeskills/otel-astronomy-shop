#
# Changes from upstream: kept only the `components`, `jaeger`, `prometheus`,
# `grafana`, and `opensearch` top-level keys, and added this header. Their
# contents are unmodified. Not a complete values file; use the upstream chart.
---
components:
  ## Demo Components are named objects (services) with several properties
  # demoService:
  ## Enable the component (service)
  #   enabled: true
  #   useDefault:
  ## Use default environment variables
  #     env: true
  ## Override Image repository and Tag. Tag will use appVersion as default.
  ## Component's name will be applied to end of this value.
  #   imageOverride: {}
  ## Optional service definitions to apply
  #   service:
  ## Service Type to use for this component. Default is ClusterIP.
  #     type: ClusterIP
  ## Service Port to use to expose this component. Default is nil
  #     port: 8080
  ## Service Node Port to use to expose this component on a NodePort service. Default is nil
  #     nodePort: 30080
  ## Service Annotations to add to this component
  #     annotations: {}
  ## Additional service ports to use to expose this component
  #   ports:
  #     - name: extraServicePort
  #       value: 8081
  ## Environment variables to add to the component's pod
  #   env:
  ## Environment variables that upsert (append + merge) into the `env` specification for this component.
  ## A variable named OTEL_RESOURCE_ATTRIBUTES_EXTRA will have its value appended to the OTEL_RESOURCE_ATTRIBUTES value.
  #   envOverrides:
  ## Pod Scheduling rules for nodeSelector, affinity, or tolerations.
  #   schedulingRules:
  #     nodeSelector: {}
  #     affinity: {}
  #     tolerations: []
  ## Pod labels to add to this component
  #   podLabels: {}
  ## Pod Annotations to add to this component
  #   podAnnotations: {}
  ## Resources for this component
  #   resources: {}
  ## Container security context for setting user ID (UID), group ID (GID) and other security policies
  #   securityContext:
  ## Ingresses rules to add for the to the component
  # ingress:
  ## Enable the creation of Ingress rules. Default is false
  #   enabled: false
  ## Annotations to add to the ingress rule
  #   annotations: {}
  ## Which Ingress class (controller) to use. Default is unspecified.
  #   ingressClassName: nginx
  ## Hosts definitions for the Ingress rule
  #   hosts:
  #     - host: demo.example.com
  ## Each host can have multiple paths/routes
  #       paths:
  #         - path: /
  #           pathType: Prefix
  #           port: 8080
  ## Optional TLS specifications for the Ingress rule
  #   tls:
  #     - secretName: demo-tls
  #       hosts:
  #         - demo.example.com
  ## Additional ingresses - only created if ingress.enabled is true
  ## Useful for when differently annotated ingress services are required
  ## Each additional ingress needs key "name" set to something unique
  #   additionalIngresses: []
  #     - name: extra-demo-ingress
  #       ingressClassName: nginx
  #       annotations: {}
  #       hosts:
  #         - host: demo.example.com
  #           paths:
  #             - path: /
  #               pathType: Prefix
  #               port: 8080
  #       tls:
  #         - secretName: demo-tls
  #           hosts:
  #             - demo.example.com
  ## Command to use in the container spec, in case you don't want to go with the default command from the image.
  #   command: []
  ## Configuration to for this component; will create a Volume, and Mount backed by an optionally created ConfigMap.
  ## The name, mountPath are required, and one of existingConfigMap or data is required.
  ## If an existing ConfigMap is not provided, the contents under data will be used for the created ConfigMap.
  #   mountedConfigMaps: []
  #     - name: my-config
  #       mountPath: /etc/config
  #       subPath:
  #       existingConfigMap: my-configmap
  #       data:
  #         my-config.yaml: |
  #           key: value
  ## Configuration to create an custom Volume
  #   additionalVolumes:
  #     - name: nginx-logs
  #       hostPath:
  #         path: /var/log/nginx
  #       type: ""
  ## Configuration to mount the custom Volume to the container
  # additionalVolumeMounts:
  #     - name: nginx-logs
  #       mountPath: /var/log/nginx
  # # Kubernetes container health check options
  #   livenessProbe: {}
  #   readinessProbe: {}
  # # Optional init container to run before the pod starts.
  #   initContainers:
  #     - name: <init-container-name>
  #       image: <init-container-image>
  #       command: [list of commands for the init container to run]
  # # Replicas for the component
  #  replicas: 1
  # # Number of old ReplicaSets to retain
  #  revisionHistoryLimit: 10
  # # Optional pod security context for setting user ID (UID), group ID (GID) and other security policies
  # # This will be applied at pod level, can be applied globally for all pods: .Values.default.podSecurityContext
  # # Or it can be applied to a specific component: .Values.components.<component-name>.podSecurityContext
  #    podSecurityContext:
  #      runAsGroup: 65534
  #      runAsNonRoot: true
  #      runAsUser: 65534

  accounting:
    enabled: true
    useDefault:
      env: true
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: KAFKA_ADDR
        value: kafka:9092
      - name: KAFKA_TOPIC
        value: orders
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: DB_CONNECTION_STRING
        value: Host=astronomy-db;Username=astronomy_user;Password=astronomy_password;Database=astronomy_db
      - name: OTEL_DOTNET_AUTO_TRACES_ENTITYFRAMEWORKCORE_INSTRUMENTATION_ENABLED
        value: "false"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 160Mi
    initContainers:
      - name: wait-for-kafka
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

  ad:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    ports:
      - name: prometheus
        value: 9465
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: AD_PORT
        value: "8080"
      - name: AD_PROMETHEUS_PORT
        value: "9465"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_LOGS_EXPORTER
        value: otlp
      - name: OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION
        value: latest
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=medium
    resources:
      limits:
        memory: 300Mi

  agent:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8010
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: AGENT_PORT
        value: "8010"
      - name: AGENT_ENDPOINT
        value: agent
      - name: GRAPH_RECURSION_LIMIT
        value: "25"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: MCP_ENDPOINT
        value: mcp
      - name: MCP_PORT
        value: "8011"
      - name: MCP_ENABLED
        value: "False"
      - name: LLM_BASE_URL
        value: https://local-llm.com
      - name: LLM_MODEL
        value: azure/gpt-5.5
      - name: API_KEY
        value: ""
      - name: OPENAI_API_KEY
        value: $(API_KEY)
      - name: USE_VCR
        value: "True"
      - name: VCR_MATCH_THRESHOLD
        value: "0.85"
      - name: LLM_TLS_VERIFY
        value: "True"
      - name: APPLICATION_ENDPOINT
        value: frontend:8080
      - name: TRACELOOP_BASE_URL
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_EXPORTER_OTLP_INSECURE
        value: "true"
      - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
        value: "true"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 500Mi
    additionalVolumeMounts:
      - name: agent-fixtures
        mountPath: /app/fixtures/vcr_cassettes
    additionalVolumes:
      - name: agent-fixtures
        configMap:
          name: agent-fixtures

  cart:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: CART_PORT
        value: "8080"
      - name: ASPNETCORE_URLS
        value: http://*:$(CART_PORT)
      - name: VALKEY_ADDR
        value: valkey-cart:6379
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
      - name: OPAMP_SERVER_ENDPOINT
        value: ws://opamp-server:4320/v1/opamp
      - name: OPAMP_SERVER_TLS_INSECURE_SKIP_VERIFY
        value: "false"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=high
    resources:
      limits:
        memory: 160Mi
    initContainers:
      - name: wait-for-valkey-cart
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;"]

  chatbot:
    enabled: true
    useDefault:
      env: true
    service:
      port: 7860
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: CHATBOT_PORT
        value: "7860"
      - name: CHATBOT_ROOT_PATH
        value: /chatbot
      - name: AGENT_PORT
        value: "8010"
      - name: AGENT_ENDPOINT
        value: agent
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_EXPORTER_OTLP_INSECURE
        value: "true"
      - name: OPAMP_SERVER_ENDPOINT
        value: ws://opamp-server:4320/v1/opamp
      - name: OPAMP_SERVER_TLS_INSECURE_SKIP_VERIFY
        value: "false"
      - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
        value: "true"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 500Mi

  checkout:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: CHECKOUT_PORT
        value: "8080"
      - name: CART_ADDR
        value: cart:8080
      - name: CURRENCY_ADDR
        value: currency:8080
      - name: EMAIL_ADDR
        value: http://email:8080
      - name: PAYMENT_ADDR
        value: payment:8080
      - name: PRODUCT_CATALOG_ADDR
        value: product-catalog:8080
      - name: SHIPPING_ADDR
        value: http://shipping:8080
      - name: KAFKA_ADDR
        value: kafka:9092
      - name: KAFKA_TOPIC
        value: orders
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: GOMEMLIMIT
        value: 16MiB
      - name: OTEL_GO_X_OBSERVABILITY
        value: "true"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=critical
    resources:
      limits:
        memory: 32Mi
    initContainers:
      - name: wait-for-kafka
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
    securityContext:
      readOnlyRootFilesystem: true
    mountedEmptyDirs:
      - name: tmp
        mountPath: /tmp

  currency:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: CURRENCY_PORT
        value: "8080"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
      - name: VERSION
        value: "{{ .Chart.AppVersion }}"
      - name: IPV6_ENABLED
        value: "false"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=high
    resources:
      limits:
        memory: 20Mi

  email:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: EMAIL_PORT
        value: "8080"
      - name: APP_ENV
        value: production
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=medium
    resources:
      limits:
        memory: 100Mi

  fraud-detection:
    enabled: true
    useDefault:
      env: true
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: KAFKA_ADDR
        value: kafka:9092
      - name: KAFKA_TOPIC
        value: orders
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES
        value: "true"
      - name: OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED
        value: "true"
      - name: OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION
        value: latest
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 300Mi
    initContainers:
      - name: wait-for-kafka
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

  frontend:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: FRONTEND_PORT
        value: "8080"
      - name: PORT
        value: $(FRONTEND_PORT)
      - name: FRONTEND_ADDR
        value: frontend:8080
      - name: AD_ADDR
        value: ad:8080
      - name: CART_ADDR
        value: cart:8080
      - name: CHECKOUT_ADDR
        value: checkout:8080
      - name: CURRENCY_ADDR
        value: currency:8080
      - name: PRODUCT_CATALOG_ADDR
        value: product-catalog:8080
      - name: RECOMMENDATION_ADDR
        value: recommendation:8080
      - name: SHIPPING_ADDR
        value: http://shipping:8080
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: ENV_PLATFORM
        value: kubernetes
      - name: OTEL_COLLECTOR_HOST
        value: $(OTEL_COLLECTOR_NAME)
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
      - name: WEB_OTEL_SERVICE_NAME
        value: frontend-web
      - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: http://localhost:8080/otlp-http/v1/traces             # This expects users to use `kubectl port-forward ...`
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=critical
    resources:
      limits:
        memory: 250Mi
    securityContext:
      runAsUser: 1001  # nextjs
      runAsGroup: 1001
      runAsNonRoot: true

  frontend-proxy:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      io.opentelemetry.discovery.metrics/enabled: 'true'
      io.opentelemetry.discovery.metrics/scraper: httpcheck
      io.opentelemetry.discovery.metrics/config: |
          targets:
            - endpoint: "http://`endpoint`"
    env:
      - name: ENVOY_PORT
        value: "8080"
      - name: ENVOY_ADDR
        value: "0.0.0.0"
      - name: ENVOY_ADMIN_PORT
        value: "10000"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: FLAGD_UI_HOST
        value: flagd
      - name: FLAGD_UI_PORT
        value: "4000"
      - name: FRONTEND_HOST
        value: frontend
      - name: FRONTEND_PORT
        value: "8080"
      - name: GRAFANA_HOST
        value: grafana
      - name: GRAFANA_PORT
        value: "80"
      - name: IMAGE_PROVIDER_HOST
        value: image-provider
      - name: IMAGE_PROVIDER_PORT
        value: "8081"
      - name: JAEGER_HOST
        value: jaeger
      - name: JAEGER_UI_PORT
        value: "16686"
      - name: CHATBOT_HOST
        value: chatbot
      - name: CHATBOT_PORT
        value: "7860"
      - name: OPAMP_SERVER_HOST
        value: opamp-server
      - name: OPAMP_SERVER_UI_PORT
        value: "4321"
      - name: FIREPIT_HOST
        value: firepit
      - name: FIREPIT_PORT
        value: "8080"
      - name: TELEMETRY_DOCS_HOST
        value: telemetry-docs
      - name: TELEMETRY_DOCS_PORT
        value: "8000"
      - name: OTEL_COLLECTOR_HOST
        value: $(OTEL_COLLECTOR_NAME)
      - name: OTEL_COLLECTOR_PORT_GRPC
        value: "4317"
      - name: OTEL_COLLECTOR_PORT_HTTP
        value: "4318"
      - name: LOCUST_WEB_HOST
        value: load-generator
      - name: LOCUST_WEB_PORT
        value: "8089"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=critical
    resources:
      limits:
        memory: 90Mi
    securityContext:
      runAsUser: 101  # envoy
      runAsGroup: 101
      runAsNonRoot: true

  image-provider:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8081
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      io.opentelemetry.discovery.metrics/enabled: 'true'
      io.opentelemetry.discovery.metrics/scraper: nginx
      io.opentelemetry.discovery.metrics/config: |
          endpoint: "http://`endpoint`/status"
          collection_interval: "10s"
          timeout: "20s"
    env:
      - name: IMAGE_PROVIDER_PORT
        value: "8081"
      - name: OTEL_COLLECTOR_PORT_GRPC
        value: "4317"
      - name: OTEL_COLLECTOR_HOST
        value: $(OTEL_COLLECTOR_NAME)
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 50Mi

  load-generator:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8089
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: LOCUST_WEB_HOST
        value: "0.0.0.0"
      - name: LOCUST_WEB_PORT
        value: "8089"
      - name: LOCUST_USERS
        value: "5"
      - name: LOCUST_HOST
        value: http://frontend-proxy:8080
      - name: LOCUST_HEADLESS
        value: "false"
      - name: LOCUST_AUTOSTART
        value: "true"
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "true"
      - name: LOCUST_HTTP_USER_WEIGHT
        value: "9"
      - name: LOCUST_BROWSER_USER_WEIGHT
        value: "1"
      - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
      - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
        value: "true"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: FLAGD_OFREP_PORT
        value: "8016"
      - name: AGENT_ENDPOINT
        value: agent
      - name: AGENT_PORT
        value: "8010"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 1500Mi

  mcp:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8011
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: MCP_PORT
        value: "8011"
      - name: MCP_ENDPOINT
        value: mcp
      - name: APPLICATION_ENDPOINT
        value: frontend:8080
      - name: TRACELOOP_BASE_URL
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_EXPORTER_OTLP_INSECURE
        value: "true"
      - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
        value: "true"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 500Mi

  payment:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: PAYMENT_PORT
        value: "8080"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
      - name: IPV6_ENABLED
        value: "false"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=critical
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: grpc
    resources:
      limits:
        memory: 140Mi
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true

  product-catalog:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: PRODUCT_CATALOG_PORT
        value: "8080"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: GOMEMLIMIT
        value: 16MiB
      - name: OTEL_GO_X_OBSERVABILITY
        value: "true"
      - name: DB_CONNECTION_STRING
        value: postgres://astronomy_user:astronomy_password@astronomy-db/astronomy_db?sslmode=disable
      - name: OTEL_SEMCONV_STABILITY_OPT_IN
        value: database
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
      - name: OPAMP_SERVER_ENDPOINT
        value: ws://opamp-server:4320/v1/opamp
      - name: OPAMP_SERVER_TLS_INSECURE_SKIP_VERIFY
        value: "false"
      - name: OTEL_CONFIG_FILE
        value: /otel-config.yml
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=high
    mountedConfigMaps:
      - name: product-catalog-otel-config
        mountPath: /otel-config.yml
        subPath: otel-config.yml
        data:
          otel-config.yml: |
            file_format: "1.0"
            disabled: false
            logger_provider:
              processors:
                - batch:
                    exporter:
                      otlp_grpc:
                        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            meter_provider:
              readers:
                - periodic:
                    exporter:
                      otlp_grpc:
                        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
                        temporality_preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-cumulative}
            tracer_provider:
              processors:
                - batch:
                    exporter:
                      otlp_grpc:
                        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
            propagator:
              composite:
                - tracecontext:
                - baggage:
            resource:
              attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
    initContainers:
      - name: wait-for-astronomy-db
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;"]
    resources:
      limits:
        memory: 32Mi
    securityContext:
      readOnlyRootFilesystem: true
    mountedEmptyDirs:
      - name: tmp
        mountPath: /tmp

  quote:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: QUOTE_PORT
        value: "8080"
      - name: OTEL_PHP_AUTOLOAD_ENABLED
        value: "true"
      - name: OTEL_PHP_INTERNAL_METRICS_ENABLED
        value: "true"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: IPV6_ENABLED
        value: "false"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 40Mi
    securityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true

  recommendation:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: RECOMMENDATION_PORT
        value: "8080"
      - name: PRODUCT_CATALOG_ADDR
        value: product-catalog:8080
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
      - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
        value: python
      - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
        value: "true"
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=medium
    resources:
      limits:
        memory: 500Mi            # This is high to enable supporting the recommendationCache feature flag use case

  shipping:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: SHIPPING_PORT
        value: "8080"
      - name: QUOTE_ADDR
        value: http://quote:8080
      - name: FLAGD_HOST
        value: flagd
      - name: FLAGD_PORT
        value: "8013"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: IPV6_ENABLED
        value: "false"
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=high
    resources:
      limits:
        memory: 20Mi
    securityContext:
      readOnlyRootFilesystem: true
    mountedEmptyDirs:
      - name: tmp
        mountPath: /tmp
    initContainers:
      - name: wait-for-flagd
        image: busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;"]

  flagd:
    enabled: true
    imageOverride:
      repository: "ghcr.io/open-feature/flagd"
      tag: "v0.16.0"
    useDefault:
      env: true
    replicas: 1
    ports:
      - name: rpc
        value: 8013
      - name: ofrep
        value: 8016
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: GOMEMLIMIT
        value: 60MiB
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 75Mi
    command:
      - "/flagd-build"
      - "start"
      - "--port"
      - "8013"
      - "--ofrep-port"
      - "8016"
      - "--uri"
      - "file:./etc/flagd/demo.flagd.json"
    mountedEmptyDirs:
      - name: config-rw
        mountPath: /etc/flagd
    # flagd-ui as a sidecar container in the same pod so the flag json file can be shared
    sidecarContainers:
      - name: flagd-ui
        useDefault:
          env: true
        service:
          port: 4000
        env:
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://$(OTEL_COLLECTOR_NAME):4318
          - name: FLAGD_UI_PORT
            value: "4000"
          - name: SECRET_KEY_BASE
            value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
          - name: PHX_HOST
            value: localhost
          - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
            value: service.criticality=low
        resources:
          limits:
            memory: 250Mi
        volumeMounts:
          - name: config-rw
            mountPath: /app/data
    initContainers:
      - name: init-config
        image: busybox
        command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json"]
        volumeMounts:
          - mountPath: /config-ro
            name: config-ro
          - mountPath: /config-rw
            name: config-rw
    additionalVolumes:
      - name: config-ro
        configMap:
          name: flagd-config

  kafka:
    enabled: true
    useDefault:
      env: true
    replicas: 1
    ports:
      - name: plaintext
        value: 9092
      - name: controller
        value: 9093
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: KAFKA_ADVERTISED_LISTENERS
        value: PLAINTEXT://kafka:9092
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: KAFKA_HEAP_OPTS
        value: "-Xmx400M -Xms400M"
      - name: KAFKA_LISTENERS
        value: PLAINTEXT://:9092,CONTROLLER://:9093
      - name: KAFKA_CONTROLLER_LISTENER_NAMES
        value: CONTROLLER
      - name: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: 1@kafka:9093
      - name: OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION
        value: latest
      - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
        value: service.criticality=low
    resources:
      limits:
        memory: 700Mi
    securityContext:
      runAsUser: 1000  # appuser
      runAsGroup: 1000
      runAsNonRoot: true

  astronomy-db:
    enabled: true
    useDefault:
      env: false
    imageOverride:
      repository: "postgres"
      tag: "18.4"
    replicas: 1
    command:
      - "docker-entrypoint.sh"
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    service:
      port: 5432
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      io.opentelemetry.discovery.metrics/enabled: 'true'
      io.opentelemetry.discovery.metrics/scraper: postgresql
      io.opentelemetry.discovery.metrics/config: |
        username: monitoring_user
        password: monitoring_password
        metrics:
          postgresql.blks_hit:
            enabled: true
          postgresql.blks_read:
            enabled: true
          postgresql.tup_fetched:
            enabled: true
          postgresql.tup_returned:
            enabled: true
          postgresql.tup_inserted:
            enabled: true
          postgresql.tup_updated:
            enabled: true
          postgresql.tup_deleted:
            enabled: true
          postgresql.deadlocks:
            enabled: true
        tls:
          insecure: true
    env:
      - name: POSTGRES_PASSWORD
        value: changeit
    mountedConfigMaps:
      - name: postgresql-init
        mountPath: /docker-entrypoint-initdb.d
        existingConfigMap: postgresql-init
    resources:
      limits:
        memory: 100Mi

  valkey-cart:
    enabled: true
    useDefault:
      env: false
    imageOverride:
      repository: "ghcr.io/valkey-io/valkey"
      tag: "9.0.4-alpine3.23"
    replicas: 1
    ports:
      - name: valkey-cart
        value: 6379
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
      io.opentelemetry.discovery.metrics/enabled: 'true'
      io.opentelemetry.discovery.metrics/scraper: redis
      io.opentelemetry.discovery.metrics/config: |
        username: valkey
        collection_interval: 10s
    resources:
      limits:
        memory: 20Mi
    securityContext:
      runAsUser: 999
      runAsGroup: 1000
      runAsNonRoot: true

  telemetry-docs:
    enabled: true
    useDefault:
      env: true
    service:
      port: 8000
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: TELEMETRY_DOCS_PORT
        value: "8000"
      - name: OTEL_COLLECTOR_HOST
        value: $(OTEL_COLLECTOR_NAME)
      - name: OTEL_COLLECTOR_PORT_GRPC
        value: "4317"
    resources:
      limits:
        memory: 100Mi
    securityContext:
      runAsUser: 101
      runAsGroup: 101
      runAsNonRoot: true

  opamp-server:
    enabled: true
    useDefault:
      env: false
    ports:
      - name: opamp
        value: 4320
      - name: opamp-ui
        value: 4321
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    resources:
      limits:
        memory: 65Mi
    command:
      - "/opamp-server"
      - "-no-tls"

  # Profiling support (disabled by default). To enable: set firepit.enabled
  # and the top-level otel-ebpf-profiler.enabled (a separate collector
  # instance, see below) to true
  firepit:
    enabled: false
    useDefault:
      env: false
    imageOverride:
      repository: "ghcr.io/florianl/firepit"
      tag: "v0.1.0"
    ports:
      - name: otlp-grpc
        value: 4317
      - name: otlp-http
        value: 4318
    service:
      port: 8080
    podAnnotations:
      resource.opentelemetry.io/service.namespace: opentelemetry-demo
    env:
      - name: BASE_PATH
        value: /profiles
    resources:
      limits:
        memory: 100Mi

jaeger:
  enabled: true
  fullnameOverride: jaeger
  uiconfig:
    useOpenTelemetryTerms: true
  jaeger:
    storage:
      type: memory
    extraEnv:
      - name: MEMORY_MAX_TRACES
        value: "25000"
      - name: PROMETHEUS_ADDR
        value: prometheus:9090
      - name: OTEL_COLLECTOR_HOST
        value: otel-collector
      - name: OTEL_COLLECTOR_PORT_HTTP
        value: "4318"
      - name: JAEGER_HOST
        value: "0.0.0.0"
      - name: JAEGER_GRPC_PORT
        value: "4317"
    resources:
      limits:
        memory: 600Mi
  userconfig:
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - periodic:
                interval: 10000
                timeout: 5000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
                    insecure: true
        logs:
          level: info
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: memory_backend
          metrics: metrics_backend
        base_path: /jaeger/ui
        ui:
          config_file: /etc/jaeger/ui-config.json
      jaeger_storage:
        backends:
          memory_backend:
            memory:
              max_traces: ${env:MEMORY_MAX_TRACES}
        metric_backends:
          metrics_backend:
            prometheus:
              endpoint: "http://${env:PROMETHEUS_ADDR}"
              normalize_calls: true
              normalize_duration: true

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:JAEGER_HOST}:${env:JAEGER_GRPC_PORT}

    processors:
      batch: {}

    exporters:
      jaeger_storage_exporter:
        trace_storage: memory_backend

prometheus:
  enabled: true
  alertmanager:
    enabled: false
  configmapReload:
    prometheus:
      enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus
    extraFlags:
      - "enable-feature=exemplar-storage"
      - "web.enable-otlp-receiver"
    retention: 7d
    tsdb:
      out_of_order_time_window: 30m
    otlp:
      keep_identifying_resource_attributes: true
      # Recommended attributes to be promoted to labels.
      promote_resource_attributes:
        - service.instance.id
        - service.name
        - service.namespace
        - service.version
        - cloud.availability_zone
        - cloud.region
        - deployment.environment.name
        # When deploying on Kubernetes, resource attributes used to identify the
        # kubernetes resources in dashboards and alerts.
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - container.name
        # When deploying on VMs, resource attributes used to identify
        # the host in dashboards and alerts.
        - host.name
        # PostgreSQL resource attributes produced by the OTel Collector PostgreSQL receiver
        # and used in dashboards and alerts.
        # See https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/postgresqlreceiver/metadata.yaml
        - postgresql.database.name
        - postgresql.schema.name
        - postgresql.table.name
        - postgresql.index.name
    persistentVolume:
      enabled: false
    service:
      servicePort: 9090
    resources:
      limits:
        memory: 400Mi

grafana:
  enabled: true
  fullnameOverride: grafana
  testFramework:
    enabled: false
  grafana.ini:
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Admin
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      serve_from_sub_path: true
  adminPassword: admin
  plugins:
    - grafana-opensearch-datasource
  sidecar:
    alerts:
      enabled: true
    dashboards:
      enabled: true
    datasources:
      enabled: true
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
  resources:
    limits:
      memory: 300Mi

opensearch:
  enabled: true
  fullnameOverride: opensearch
  clusterName: demo-cluster
  nodeGroup: otel-demo
  singleNode: true
  opensearchJavaOpts: "-Xms400m -Xmx400m"
  persistence:
    enabled: false
  extraEnvs:
    - name: "bootstrap.memory_lock"
      value: "true"
    - name: "DISABLE_INSTALL_DEMO_CONFIG"
      value: "true"
    - name: "DISABLE_SECURITY_PLUGIN"
      value: "true"
  resources:
    limits:
      memory: 1100Mi
